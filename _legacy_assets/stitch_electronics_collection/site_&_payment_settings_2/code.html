<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>What’s the Drama? Support Form</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#a855f7",
                        "dark-input": "#111827",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        .gradient-btn {
            background: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
        }
        body {
            min-height: 100dvh;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-black font-display text-slate-100 min-h-screen flex flex-col">
<div class="h-10 w-full bg-black"></div>
<header class="sticky top-0 z-50 bg-black/80 backdrop-blur-md">
<div class="flex items-center p-4 justify-between max-w-md mx-auto">
<div class="text-white cursor-pointer">
<span class="material-symbols-outlined text-[28px]">close</span>
</div>
<h1 class="text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-8 italic">Shopaholics Inc.</h1>
</div>
</header>
<main class="max-w-md mx-auto p-6 flex-grow space-y-8">
<div class="space-y-2">
<h2 class="text-3xl font-bold tracking-tight">What’s the drama?</h2>
<p class="text-slate-400 text-sm">Alright, what’s the drama? We’re all ears.</p>
</div>
<form class="space-y-6">
<div class="space-y-4">
<div class="space-y-2">
<label class="text-xs font-semibold text-slate-500 uppercase tracking-widest px-1">Your Name</label>
<input class="w-full bg-dark-input border border-slate-800 rounded-xl py-4 px-4 text-white focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-slate-600" placeholder="Who are we dealing with?" type="text"/>
</div>
<div class="space-y-2">
<label class="text-xs font-semibold text-slate-500 uppercase tracking-widest px-1">Order Number (optional)</label>
<input class="w-full bg-dark-input border border-slate-800 rounded-xl py-4 px-4 text-white focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-slate-600" placeholder="Maybe look at your confirmation email?" type="text"/>
</div>
<div class="space-y-2">
<label class="text-xs font-semibold text-slate-500 uppercase tracking-widest px-1">Spill the beans</label>
<textarea class="w-full bg-dark-input border border-slate-800 rounded-xl py-4 px-4 text-white focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-slate-600 resize-none" placeholder="Your message... go on, don't hold back." rows="6"></textarea>
</div>
</div>
<div class="space-y-4 pt-4">
<button class="gradient-btn w-full py-4 rounded-xl text-white font-bold text-lg shadow-lg shadow-primary/20 active:scale-[0.98] transition-all" type="button">
                    Send to the Mate
                </button>
<p class="text-center text-[11px] text-slate-500 italic">
                    We usually reply faster than you can regret a 2 AM purchase.
                </p>
</div>
</form>
</main>
<footer class="max-w-md mx-auto w-full p-8 mt-auto">
<div class="flex justify-center items-center gap-8 text-slate-500">
<a class="hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-2xl">mail</span>
</a>
<a class="hover:text-primary transition-colors" href="#">
<svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
<path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path>
</svg>
</a>
<a class="hover:text-primary transition-colors" href="#">
<svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
<path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.266.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.848 0-3.204.012-3.584.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"></path>
</svg>
</a>
</div>
</footer>
<div class="fixed bottom-1 left-1/2 -translate-x-1/2 w-32 h-1 bg-slate-800 rounded-full"></div>

</body></html>
