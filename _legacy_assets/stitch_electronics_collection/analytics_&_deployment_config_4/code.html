<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Budget Limit Alert</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#a855f7",
                        "secondary": "#3b82f6",
                        "background-dark": "#000000",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        :root {
            --gradient-start: #a855f7;
            --gradient-end: #3b82f6;
        }
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .text-gradient {
            background: linear-gradient(to right, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .bg-gradient-primary {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
        }
        .white-border {
            border: 1px solid rgba(255, 255, 255, 1);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 48;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark text-white font-display min-h-screen">
<div class="max-w-[430px] mx-auto min-h-screen flex flex-col relative overflow-hidden">
<div class="h-12 w-full"></div>
<div class="px-6 flex justify-end">
<button class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center backdrop-blur-md">
<span class="material-symbols-outlined text-white text-2xl">close</span>
</button>
</div>
<main class="flex-1 flex flex-col items-center justify-center px-8 text-center">
<div class="relative mb-8">
<div class="w-48 h-48 bg-gradient-to-b from-white/5 to-white/0 rounded-full flex items-center justify-center relative">
<span class="material-symbols-outlined text-[100px] text-white/20">smart_toy</span>
<div class="absolute inset-0 flex items-center justify-center">
<div class="flex gap-4 mt-2">
<div class="w-4 h-1 bg-white/40 rounded-full -rotate-12"></div>
<div class="w-4 h-1 bg-white/40 rounded-full rotate-12"></div>
</div>
</div>
</div>
<div class="absolute -top-2 -right-2 w-12 h-12 bg-red-500 rounded-full flex items-center justify-center border-4 border-black animate-pulse">
<span class="material-symbols-outlined text-white font-bold">priority_high</span>
</div>
</div>
<h1 class="text-4xl font-extrabold tracking-tight mb-6 leading-tight">
<span class="text-gradient">Mate, Your Wallet's Crying</span>
</h1>
<div class="space-y-4 mb-12">
<p class="text-xl font-medium text-white/90">
                    You’ve blown past your <span class="text-white font-bold">£500</span> monthly limit. 
                </p>
<p class="text-lg text-white/60 leading-relaxed">
                    This latest "essential" puts you <span class="text-red-400 font-bold">£120 in the red</span>. Even your bank account thinks you should chill.
                </p>
</div>
<div class="w-full space-y-4">
<button class="w-full bg-gradient-primary text-white font-bold py-5 rounded-2xl shadow-xl shadow-primary/20 active:scale-[0.98] transition-all text-base">
                    Buy it anyway (I have no self-control)
                </button>
<button class="w-full white-border text-white font-bold py-5 rounded-2xl bg-transparent active:bg-white/10 transition-all text-base">
                    Save it for when I’m flush (Wishlist)
                </button>
</div>
</main>
<footer class="pb-12 pt-6 text-center">
<p class="text-[10px] uppercase tracking-[0.2em] text-white/30 font-medium">
                Don't say we didn't warn you.
            </p>
</footer>
<div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-white/20 rounded-full"></div>
</div>

</body></html>
