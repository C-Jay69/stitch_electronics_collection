<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Join the Madness | Shopaholics Inc</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#a855f7",
                        "secondary": "#06b6d4",
                        "background-dark": "#000000",
                        "input-bg": "#111827",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-black text-white font-display;
            }
        }
        .ios-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .gradient-btn {
            background: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
        }
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus {
            -webkit-text-fill-color: white;
            -webkit-box-shadow: 0 0 0px 1000px #111827 inset;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col justify-center items-center p-6">
<div class="w-full max-w-md space-y-8">
<div class="space-y-2 text-center">
<h1 class="text-3xl font-bold tracking-tight text-white leading-tight">
                Ready to ruin your <br/>
<span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-cyan-400">credit score?</span>
</h1>
<p class="text-gray-400 text-sm">Join the madness. We won't judge your spending habits.</p>
</div>
<form class="mt-8 space-y-5" onsubmit="return false;">
<div class="space-y-4">
<div class="space-y-1.5">
<label class="text-xs font-medium text-gray-400 uppercase tracking-widest px-1">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-xl">person</span>
<input class="w-full bg-gray-900 border-none rounded-2xl py-4 pl-12 pr-4 text-white placeholder:text-gray-600 focus:ring-2 focus:ring-primary transition-all" placeholder="John Doe (or whatever's on the card)" type="text"/>
</div>
</div>
<div class="space-y-1.5">
<label class="text-xs font-medium text-gray-400 uppercase tracking-widest px-1">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-xl">alternate_email</span>
<input class="w-full bg-gray-900 border-none rounded-2xl py-4 pl-12 pr-4 text-white placeholder:text-gray-600 focus:ring-2 focus:ring-primary transition-all" placeholder="spam-me@example.com" type="email"/>
</div>
</div>
<div class="space-y-1.5">
<label class="text-xs font-medium text-gray-400 uppercase tracking-widest px-1">Secret Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-xl">lock</span>
<input class="w-full bg-gray-900 border-none rounded-2xl py-4 pl-12 pr-4 text-white placeholder:text-gray-600 focus:ring-2 focus:ring-primary transition-all" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
<p class="text-[11px] text-gray-500 text-center leading-relaxed">
                By signing up, you agree to buy things you don't need. <br/>
<a class="text-primary hover:underline" href="#">No backsies.</a>
</p>
<button class="w-full gradient-btn text-white font-bold py-4 rounded-2xl shadow-lg shadow-purple-500/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                Start Shopping
                <span class="material-symbols-outlined text-xl">shopping_cart</span>
</button>
</form>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-gray-800"></div>
<span class="flex-shrink mx-4 text-xs text-gray-600 uppercase font-bold">Or take the easy way out</span>
<div class="flex-grow border-t border-gray-800"></div>
</div>
<button class="w-full bg-white text-black font-semibold py-4 rounded-2xl flex items-center justify-center gap-3 active:scale-[0.98] transition-all">
<svg class="w-5 h-5" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.16H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.84l3.66-2.75z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.16l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
            Continue with Google
        </button>
<div class="text-center pt-4">
<a class="text-sm text-gray-400 hover:text-white transition-colors" href="#">
                Already a member of the chaos? <span class="text-primary font-semibold">Login here.</span>
</a>
</div>
</div>
<div class="fixed bottom-2 w-32 h-1 bg-gray-800 rounded-full"></div>

</body></html>
