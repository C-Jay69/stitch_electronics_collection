<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Meet Your Shopping Mate</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#a855f7",
                        "background-light": "#f7f5f8",
                        "background-dark": "#191022",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-white overflow-hidden">
<div class="relative flex h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-hidden">
<!-- Status Bar Area (iOS Style) -->
<div class="h-12 w-full flex items-center justify-between px-8 pt-4">
<span class="text-sm font-semibold dark:text-white">9:41</span>
<div class="flex gap-1.5">
<span class="material-symbols-outlined text-sm">signal_cellular_alt</span>
<span class="material-symbols-outlined text-sm">wifi</span>
<span class="material-symbols-outlined text-sm">battery_full</span>
</div>
</div>
<!-- Main Content Area -->
<div class="flex flex-col grow items-center justify-between px-8 pt-10 pb-12">
<!-- Headline Section -->
<div class="w-full text-center space-y-4">
<h1 class="text-4xl md:text-5xl font-extrabold tracking-tight leading-[1.1] bg-gradient-to-br from-white via-white to-primary/60 bg-clip-text text-transparent">
                    Meet your new best <span class="italic text-primary">(and worst)</span> mate.
                </h1>
</div>
<!-- Mascot Illustration Placeholder -->
<div class="relative w-full flex items-center justify-center py-12">
<!-- Glowing effect behind the mascot -->
<div class="absolute w-64 h-64 bg-primary/20 blur-[80px] rounded-full"></div>
<!-- Mascot Image -->
<div class="relative z-10 w-full max-w-[280px] aspect-square flex items-center justify-center">
<div class="w-full h-full bg-center bg-no-repeat bg-contain" data-alt="Minimalist floating robot with a cheeky digital expression" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuD7CJ7uRcBQ0WI_uSRXE0-8kETAXjUHcAEoTdLczukXrtrMncinPO55_kAhCy1iwKGLgvR8_OpW1OcmiPdWw10Ps08fulv5v6KbfiFNQaTMuyWnRcuQbJBzBHzri7FCnSsB07m8RoPr3aH8ncWxSlujVojxfKEkbhZAVBP7omMQgL0E0fREuqiJTEnIN7DoEa9BW-aoOfh91IRHvDjKjablz-q0y4xveW-Yo6tOADp8kJMALJPN2t4Mr14LOL2wa6axo2OkxCDNFmo");'>
</div>
</div>
</div>
<!-- Subtext & Controls -->
<div class="w-full flex flex-col items-center space-y-10">
<p class="text-lg text-slate-400 font-medium text-center leading-relaxed max-w-xs">
                    He’s here to save you from your <span class="text-white">2 AM impulses</span> and overpriced nonsense.
                </p>
<!-- Progress Dots -->
<div class="flex gap-3">
<div class="h-2 w-6 rounded-full bg-primary transition-all duration-300"></div>
<div class="h-2 w-2 rounded-full bg-primary/20"></div>
<div class="h-2 w-2 rounded-full bg-primary/20"></div>
</div>
<!-- Action Button -->
<button class="w-full h-16 bg-primary hover:bg-primary/90 text-white font-bold text-lg rounded-xl flex items-center justify-center gap-2 group transition-all">
<span>Next</span>
<span class="material-symbols-outlined text-xl transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</div>
</div>
<!-- Home Indicator (iOS Style) -->
<div class="flex justify-center pb-2">
<div class="w-32 h-1 bg-white/20 rounded-full"></div>
</div>
</div>
</body></html>
