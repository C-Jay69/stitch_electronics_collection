<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#a855f7",
                        "background-light": "#f7f5f8",
                        "background-dark": "#000000",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-white overflow-hidden">
<!-- Main Container (iOS Mobile Optimized) -->
<div class="relative flex min-h-screen w-full flex-col items-center justify-center px-8 py-12 overflow-hidden">
<!-- Animated Background Glow -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-primary/20 rounded-full blur-[120px] pointer-events-none"></div>
<!-- Robot "Mate" Illustration Area -->
<div class="relative flex flex-col items-center justify-center mb-12">
<!-- Zzz Elements -->
<div class="absolute -top-12 right-0 flex flex-col gap-4">
<span class="material-symbols-outlined text-primary text-2xl opacity-40 select-none">bedtime</span>
<span class="text-primary text-xl font-bold opacity-60 ml-6 select-none">Z</span>
<span class="text-primary text-sm font-bold opacity-30 ml-12 select-none">z</span>
</div>
<!-- Stylized Robot Icon -->
<div class="w-48 h-48 bg-gradient-to-b from-[#1a1a1a] to-[#0a0a0a] rounded-full flex items-center justify-center border border-white/10 shadow-2xl relative overflow-hidden group">
<div class="absolute inset-0 bg-primary/5 opacity-50"></div>
<!-- Robot Head/Body Shape -->
<div class="w-32 h-24 bg-[#222] rounded-3xl border-2 border-white/5 flex flex-col items-center justify-center gap-4">
<!-- Sleeping Eyes -->
<div class="flex gap-6 mt-2">
<div class="w-8 h-1 bg-primary/40 rounded-full"></div>
<div class="w-8 h-1 bg-primary/40 rounded-full"></div>
</div>
<!-- Status Light -->
<div class="w-2 h-2 bg-primary rounded-full animate-pulse shadow-[0_0_8px_#a855f7]"></div>
</div>
</div>
<!-- Shadow below the robot -->
<div class="w-32 h-4 bg-primary/10 rounded-[100%] blur-md mt-6"></div>
</div>
<!-- Typography Content -->
<div class="text-center max-w-sm space-y-4">
<h1 class="text-4xl font-bold tracking-tight leading-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-white to-primary/50">
                Site’s having a nap. <br/>Back in a bit.
            </h1>
<p class="text-gray-400 text-base leading-relaxed font-normal px-2">
                We’re probably fixing something we broke, or the Mate is on a coffee break. Either way, try again in a few. We won't be long, promise.
            </p>
</div>
<!-- Notification Form -->
<div class="mt-12 w-full max-w-xs space-y-4">
<div class="relative group">
<input class="w-full bg-[#111] border border-white/10 rounded-xl h-14 px-5 text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-gray-600" placeholder="Enter your email for the wake-up call..." type="email"/>
</div>
<button class="w-full bg-white dark:bg-white text-black font-bold h-14 rounded-xl hover:bg-gray-200 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>Notify me when we’re awake</span>
<span class="material-symbols-outlined text-[18px]">notifications_active</span>
</button>
</div>
<!-- Brand Footer -->
<div class="absolute bottom-10 flex flex-col items-center gap-2 opacity-30">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-sm">shopping_bag</span>
<span class="text-xs font-bold uppercase tracking-widest">Shopaholics Inc.</span>
</div>
<div class="h-[1px] w-8 bg-white/20"></div>
</div>
<!-- Background Image/Texture Overlay -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] bg-[url('https://placeholder.pics/svg/100')]" data-alt="Subtle noise texture overlay for depth"></div>
</div>
</body></html>
